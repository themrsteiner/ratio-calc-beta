
name: Deploy to GitHub Pages



on:

  push:

    branches:

      - main

  workflow_dispatch:



permissions:

  contents: read

  pages: write

  id-token: write



concurrency:

  group: pages

  cancel-in-progress: true



jobs:

  build:

    runs-on: ubuntu-latest



    steps:

      - name: Checkout

        uses: actions/checkout@v4



      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: 20



      - name: Show versions

        working-directory: ratio-compliance-app-v1

        run: |

          node --version

          npm --version



      - name: Clean npm cache

        run: npm cache clean --force



      - name: Install dependencies

        working-directory: ratio-compliance-app-v1

        run: npm ci --no-audit --no-fund



      - name: Build

        working-directory: ratio-compliance-app-v1

        run: npm run build



      - name: Upload Pages artifact

        uses: actions/upload-pages-artifact@v3

        with:

          path: ratio-compliance-app-v1/dist



  deploy:

    needs: build

    runs-on: ubuntu-latest



    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}



    steps:

      - name: Deploy

        id: deployment

        uses: actions/deploy-pages@v4

